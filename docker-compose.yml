services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: passkey
      POSTGRES_PASSWORD: passkey
      POSTGRES_DB: passkey_auth
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passkey -d passkey_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
